name: PhonecaptureImportBar

options:
  bundleIdPrefix: com.hapticasensorics
  deploymentTarget:
    macOS: "14.0"

targets:
  PhonecaptureImportBar:
    type: application
    platform: macOS
    sources:
      - Sources
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hapticasensorics.phonecaptureimportbar
        PRODUCT_NAME: Fone
        SWIFT_VERSION: 5.0
        MARKETING_VERSION: 0.1.8-alpha1
        CURRENT_PROJECT_VERSION: 7
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Fone
        INFOPLIST_KEY_LSUIElement: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
